<!DOCTYPE html>
<!--
  Dummy-data dashboard mock for the README hero shots (THI-123).

  One self-contained HTML page with 5 views — `?view=kanban|terminal|palette|rename|settings`.
  Uses the same CSS tokens + selectors as Switchboard's `styles.css` so the
  visual identity matches without rendering anything pulled from a real
  tmux server. All session names, branches, PRs, file paths are fake.

  Drive from Playwright (see capture.ts in the same dir). No backend required.
-->
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>Switchboard mock · README hero shots</title>
  <style>
    /* ─── Tokens (mirrored from styles.css :root, dark theme) ─── */
    :root {
      --bg:        #0b0c0f;
      --bg-elev:   #111317;
      --panel:     #15181e;
      --panel-2:   #1a1e25;
      --panel-3:   #23272f;
      --hairline:  rgba(255,255,255,.08);
      --hairline-strong: rgba(255,255,255,.14);
      --text:      #e7e9ee;
      --text-mute: #9aa0ad;
      --text-dim:  #6b7180;
      --accent:        oklch(0.78 0.13 145);
      --accent-soft:   oklch(0.78 0.13 145 / 0.16);
      --accent-edge:   oklch(0.78 0.13 145 / 0.55);
      --tone-cyan:   oklch(0.78 0.13 220);
      --tone-amber:  oklch(0.80 0.14 80);
      --tone-green:  oklch(0.78 0.13 145);
      --tone-red:    #CC6666;
      --tone-gray:   oklch(0.65 0.01 250);
      --tone-magenta: oklch(0.72 0.16 330);
      --tone-lilac:  oklch(0.74 0.12 295);
      --tone-sky:    oklch(0.78 0.13 240);
      --tone-orange: color-mix(in oklch, var(--tone-amber) 60%, var(--tone-red));
      --r-sm: 6px;
      --r:    10px;
      --r-lg: 14px;
      --shadow-card: 0 1px 0 rgba(255,255,255,.03) inset, 0 1px 2px rgba(0,0,0,.4);
      --shadow-lift: 0 1px 0 rgba(255,255,255,.04) inset, 0 8px 24px rgba(0,0,0,.45);
      --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.45;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    code { font-family: var(--font-mono); font-size: 11.5px; }

    /* ─── App shell ─── */
    .app { display: flex; flex-direction: column; height: 100vh; }

    /* Top header */
    .header {
      display: flex; align-items: center; gap: 12px;
      padding: 8px 12px;
      background: var(--bg-elev);
      border-bottom: 1px solid var(--hairline);
      flex: 0 0 auto;
    }
    .brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
    .brand .mark { width: 18px; height: 18px; border-radius: 5px; background: var(--accent); color: var(--bg); display: grid; place-items: center; font-size: 11px; font-weight: 700; }
    .server-addr { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); padding: 2px 8px; border: 1px solid var(--hairline); border-radius: 6px; }
    .counts { display: inline-flex; gap: 6px; font-size: 11.5px; color: var(--text-mute); }
    .counts b { color: var(--text); font-weight: 600; }
    .counts .amber b { color: var(--tone-amber); }
    .counts .cyan b { color: var(--tone-cyan); }
    .spacer { flex: 1; }
    .usage-pill {
      display: inline-flex; gap: 10px;
      padding: 3px 10px;
      background: var(--panel);
      border: 1px solid var(--hairline);
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-mute);
    }
    .usage-pill .meter { display: inline-flex; align-items: center; gap: 4px; }
    .usage-pill .meter b { color: var(--text); font-weight: 600; }
    .usage-pill .bar { width: 28px; height: 6px; background: var(--hairline); border-radius: 999px; overflow: hidden; }
    .usage-pill .bar i { display: block; height: 100%; background: var(--tone-green); }
    .usage-pill .cost b { color: var(--tone-green); }
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      height: 28px; padding: 0 10px;
      border: 1px solid var(--hairline);
      background: var(--panel);
      color: var(--text);
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn:hover { border-color: var(--hairline-strong); background: var(--panel-3); }
    .btn-ghost { border-color: transparent; background: transparent; color: var(--text-mute); width: 28px; padding: 0; justify-content: center; }
    .btn-ghost:hover { background: var(--hairline-strong); border-color: var(--hairline-strong); color: var(--text); }
    .btn-icon { width: 28px; height: 28px; padding: 0; justify-content: center; }
    .btn-primary { background: var(--accent-soft); border-color: var(--accent-edge); color: var(--text); }
    .btn-primary:hover { background: color-mix(in oklch, var(--accent) 22%, transparent); }
    .btn-danger { background: color-mix(in oklch, var(--tone-red) 16%, transparent); border-color: color-mix(in oklch, var(--tone-red) 45%, transparent); color: var(--tone-red); }

    /* Needs strip */
    .needs-strip {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 12px;
      background: color-mix(in oklch, var(--tone-amber) 10%, transparent);
      border-bottom: 1px solid color-mix(in oklch, var(--tone-amber) 30%, transparent);
      font-size: 11.5px;
      color: var(--text);
    }
    .needs-strip .badge { font-family: var(--font-mono); font-size: 10.5px; padding: 1px 6px; border-radius: 4px; background: var(--tone-amber); color: var(--bg); font-weight: 700; }
    .needs-strip button.needs-card { display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px; background: var(--panel); border: 1px solid var(--hairline); border-radius: 6px; color: var(--text); cursor: pointer; }
    .needs-strip .crumb { color: var(--text-mute); }
    .needs-strip .action { color: var(--tone-amber); font-style: italic; }

    /* Subhead */
    .subhead { display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: var(--bg); border-bottom: 1px solid var(--hairline); flex: 0 0 auto; }
    .search { display: inline-flex; align-items: center; gap: 6px; flex: 1; max-width: 360px; padding: 4px 10px; background: var(--panel); border: 1px solid var(--hairline); border-radius: 6px; }
    .search input { flex: 1; background: transparent; border: 0; outline: 0; color: var(--text); font: inherit; }
    .search .kbd { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); padding: 1px 5px; border: 1px solid var(--hairline); border-radius: 3px; }
    .tab { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; font-size: 11.5px; color: var(--text-mute); border-radius: 6px; }
    .tab:hover { background: var(--panel-3); color: var(--text); }
    .tab.is-active { background: var(--panel); color: var(--text); border: 1px solid var(--hairline); }
    .tab .stat-dot { width: 8px; height: 8px; border-radius: 50%; }
    .stat-dot.amber { background: var(--tone-amber); }
    .stat-dot.cyan { background: var(--tone-cyan); }
    .stat-dot.gray { background: var(--tone-gray); }
    .tab .count { font-family: var(--font-mono); color: var(--text-dim); margin-left: 3px; }

    /* Kanban */
    .main { flex: 1; overflow: hidden; padding: 14px; background: var(--bg); }
    .kanban { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; height: 100%; overflow-x: auto; }
    .col { background: var(--panel); border: 1px solid var(--hairline); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; min-height: 540px; }
    .col-hd { display: flex; align-items: center; gap: 7px; padding: 9px 11px; background: var(--bg-elev); border-bottom: 1px solid var(--hairline); }
    .col-name { display: inline-flex; align-items: center; gap: 7px; flex: 1; font-weight: 600; font-size: 12.5px; }
    .col-name .col-name-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); }
    .col-name-dot.attached { background: var(--accent); }
    .col-count { padding: 2px 8px; border-radius: 999px; background: var(--hairline); font-family: var(--font-mono); font-size: 11px; color: var(--text-mute); min-width: 24px; text-align: center; }
    .col-actions { display: flex; gap: 2px; align-items: center; }
    .col-actions .btn-auto-rename {
      height: 22px; width: 22px;
      display: grid; place-items: center;
      border-radius: 6px;
      background: linear-gradient(135deg, var(--tone-amber), var(--accent));
      color: var(--bg);
    }
    .col-actions .col-quick { height: 22px; padding: 0 7px; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-mute); border-radius: 6px; }
    .col-actions .col-quick:hover { color: var(--text); background: var(--panel-2); border: 1px solid var(--hairline); }
    .col-actions .kebab { width: 22px; height: 22px; display: grid; place-items: center; color: var(--text-mute); border-radius: 6px; }
    .col-body { padding: 10px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }

    /* Card */
    .card { background: var(--bg-elev); border: 1px solid var(--hairline); border-radius: 10px; overflow: hidden; cursor: grab; }
    .card.waiting { border-color: color-mix(in oklch, var(--tone-amber) 45%, var(--hairline)); }
    .card.running { border-color: color-mix(in oklch, var(--tone-cyan) 35%, var(--hairline)); }
    .card-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; }
    .card-kind { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 5px; background: var(--hairline); color: var(--text-mute); font-family: var(--font-mono); font-size: 10px; font-weight: 700; }
    .card-kind.kind-agent { color: var(--accent); background: color-mix(in oklch, var(--accent) 18%, var(--bg-elev)); }
    .card-kind.kind-shell { color: var(--tone-cyan); background: color-mix(in oklch, var(--tone-cyan) 18%, var(--bg-elev)); }
    .card-name { flex: 1; min-width: 0; font-weight: 600; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--font-mono); letter-spacing: -.01em; }
    .card-idx { color: var(--text-dim); font-family: var(--font-mono); font-size: 11px; }
    .card-status { display: inline-flex; align-items: center; gap: 5px; padding: 2px 7px; border-radius: 999px; font-size: 10.5px; font-family: var(--font-mono); text-transform: lowercase; border: 1px solid currentColor; background: color-mix(in oklch, currentColor 12%, transparent); }
    .card-status .glyph { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .card-status.idle    { color: var(--tone-green); }
    .card-status.running { color: var(--tone-cyan); }
    .card-status.waiting { color: var(--tone-amber); }
    .chip-row { display: flex; align-items: center; gap: 6px; padding: 0 10px 6px; }
    .chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--hairline); font-family: var(--font-mono); font-size: 10.5px; color: var(--text-mute); }
    .chip .ci-dot { width: 6px; height: 6px; border-radius: 50%; }
    .ci-passing { background: var(--tone-green); }
    .ci-failing { background: var(--tone-red); }
    .ci-running { background: var(--tone-cyan); }
    .chip.pr { color: var(--tone-lilac); border-color: color-mix(in oklch, var(--tone-lilac) 30%, var(--hairline)); }
    .spinner-row { padding-top: 0; padding-bottom: 4px; }
    .chip.spinner { color: var(--tone-cyan); }
    .recap { padding: 0 10px 8px; font-size: 11.5px; color: var(--text-mute); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .pending { margin: 0 10px 10px; padding: 6px 8px; display: flex; gap: 6px; background: color-mix(in oklch, var(--tone-amber) 12%, transparent); border: 1px solid color-mix(in oklch, var(--tone-amber) 35%, transparent); border-radius: var(--r-sm); color: var(--text); font-family: var(--font-mono); font-size: 11px; }
    .pending .glyph { color: var(--tone-amber); font-weight: 700; }
    .card-foot { display: flex; align-items: center; gap: 4px; padding: 6px 8px; border-top: 1px solid var(--hairline); background: var(--panel); }
    .card-foot .act { width: 22px; height: 22px; display: grid; place-items: center; color: var(--text-dim); border-radius: 5px; }
    .card-foot .act:hover { background: var(--hairline); color: var(--text); }
    .card-foot .spacer { flex: 1; }
    .card-foot .ago { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-dim); padding: 0 4px; }

    /* Scrim + modals */
    .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; backdrop-filter: blur(1px); }
    .term-modal {
      width: min(1100px, 92vw); height: min(680px, 88vh);
      background: var(--panel); border: 1px solid var(--hairline-strong); border-radius: var(--r-lg);
      box-shadow: var(--shadow-lift);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .term-hd { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: linear-gradient(#0c0e12, #0a0b0e); border-bottom: 1px solid var(--hairline); }
    .term-hd .tl-dots { display: inline-flex; gap: 6px; }
    .term-hd .tl-dots i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
    .tl-dots i:nth-child(1){ background:#FF5F57;} .tl-dots i:nth-child(2){ background:#FEBC2E;} .tl-dots i:nth-child(3){ background:#28C840;}
    .term-title { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 12px; color: var(--text-mute); flex: 1; min-width: 0; }
    .term-title b { color: var(--text); font-weight: 600; }
    .term-title .crumb-sep { color: var(--text-dim); }
    .term-title .term-action { color: var(--tone-amber); font-style: italic; }
    .term-body { flex: 1; padding: 16px 22px; background: radial-gradient(900px 360px at 80% 0%, color-mix(in oklch, var(--accent) 12%, transparent), transparent 70%), #050608; color: #d6d9e0; font-family: var(--font-mono); font-size: 13px; line-height: 1.55; overflow: auto; white-space: pre-wrap; position: relative; }
    .term-body .dim { color: var(--text-dim); }
    .term-body .ok { color: var(--tone-green); }
    .term-body .info { color: var(--tone-cyan); }
    .term-body .warn { color: var(--tone-amber); }
    .term-body .err { color: var(--tone-red); }
    .term-body .glyph { color: var(--accent); }
    .term-body .prompt-overlay { position: absolute; left: 22px; right: 22px; bottom: 18px; padding: 12px 14px; background: color-mix(in oklch, var(--tone-amber) 14%, var(--panel)); border: 1px solid color-mix(in oklch, var(--tone-amber) 50%, transparent); border-radius: var(--r); color: var(--text); font-family: var(--font-sans); font-size: 13px; box-shadow: var(--shadow-card); }
    .term-body .prompt-overlay b { color: var(--tone-amber); font-weight: 700; margin-right: 6px; }
    .term-body .prompt-overlay .opts { margin-top: 6px; display: flex; gap: 8px; color: var(--text-mute); font-family: var(--font-mono); font-size: 11.5px; }
    .term-body .prompt-overlay .opts kbd { font-family: var(--font-mono); padding: 0 5px; border: 1px solid var(--hairline); border-radius: 3px; color: var(--text); }
    .term-foot { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: linear-gradient(#0a0b0e, #07080a); border-top: 1px solid var(--hairline); font-family: var(--font-mono); font-size: 11px; color: var(--text-mute); }
    .connect-pill { display: inline-flex; gap: 6px; padding: 2px 10px; border-radius: 999px; background: color-mix(in oklch, var(--tone-green) 18%, transparent); color: var(--tone-green); }
    .connect-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; align-self: center; box-shadow: 0 0 6px currentColor; }
    .term-cwd { color: var(--text-mute); flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; }
    .term-spacer { flex: 1; }

    /* Palette */
    .palette { width: 460px; background: var(--panel); border: 1px solid var(--hairline-strong); border-radius: var(--r-lg); box-shadow: var(--shadow-lift); padding: 12px 0; }
    .palette-hd { padding: 6px 14px 10px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--hairline); }
    .palette-hd .target { flex: 1; color: var(--text); font-size: 13px; }
    .palette-hd .esc { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-dim); padding: 1px 5px; border: 1px solid var(--hairline); border-radius: 4px; }
    .palette-section { padding: 8px 14px 4px; font-size: 10px; font-family: var(--font-mono); color: var(--text-dim); text-transform: uppercase; letter-spacing: .08em; }
    .palette-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 14px; color: var(--text); font-size: 12.5px; cursor: pointer; }
    .palette-item:hover, .palette-item.is-active { background: var(--accent-soft); }
    .palette-item .icon { width: 16px; color: var(--accent); }
    .palette-item .label { font-family: var(--font-mono); font-size: 12px; flex: 0 0 auto; }
    .palette-item .hint { color: var(--text-mute); font-size: 11.5px; }
    .palette-foot { padding: 8px 14px 4px; display: flex; gap: 12px; color: var(--text-dim); font-size: 10.5px; font-family: var(--font-mono); border-top: 1px solid var(--hairline); margin-top: 6px; padding-top: 8px; }

    /* Auto-rename modal */
    .auto-rename-modal { width: min(720px, 92vw); background: var(--panel); border: 1px solid var(--hairline-strong); border-radius: var(--r-lg); box-shadow: var(--shadow-lift); }
    .rename-hd { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--hairline); }
    .rename-hd .sparkle { color: var(--tone-amber); }
    .rename-hd b { font-size: 13px; font-weight: 600; }
    .rename-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; max-height: 60vh; overflow: auto; }
    .rename-row { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border: 1px solid var(--hairline); border-radius: var(--r-sm); background: var(--bg-elev); }
    .rename-row .row-head { display: flex; align-items: center; gap: 10px; color: var(--text-dim); font-family: var(--font-mono); font-size: 11px; }
    .rename-row .row-head .lbl { width: 36px; }
    .rename-row .old { color: var(--text-mute); }
    .rename-row .row-body { display: flex; align-items: center; gap: 10px; }
    .rename-row .row-body .lbl { width: 36px; color: var(--text-dim); font-family: var(--font-mono); font-size: 11px; }
    .rename-row input { flex: 1; padding: 5px 10px; background: var(--panel-2); border: 1px solid var(--hairline); border-radius: 5px; color: var(--text); font-family: var(--font-mono); font-size: 12.5px; }
    .rename-row .skip { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); padding: 4px 10px; border: 1px solid var(--hairline); border-radius: 5px; }
    .rename-row .skip:hover { color: var(--text); border-color: var(--hairline-strong); }
    .rename-row.noop { opacity: .55; }
    .rename-foot { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--hairline); }
    .rename-foot .summary { color: var(--text-mute); font-family: var(--font-mono); font-size: 11px; }
    .rename-foot .summary b { color: var(--text); font-weight: 600; }
    .rename-foot .cost b { color: var(--tone-green); }

    /* Settings modal */
    .settings-modal { width: min(680px, 92vw); max-height: 86vh; background: var(--panel); border: 1px solid var(--hairline-strong); border-radius: var(--r-lg); box-shadow: var(--shadow-lift); display: flex; flex-direction: column; }
    .settings-hd { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--hairline); }
    .settings-hd b { font-size: 13px; font-weight: 600; }
    .settings-hd .conn { margin-left: auto; }
    .settings-body { padding: 14px 16px; overflow: auto; display: flex; flex-direction: column; gap: 16px; }
    .settings-group { border: 1px solid var(--hairline); border-radius: var(--r-sm); background: var(--bg-elev); padding: 8px 12px; }
    .settings-group h4 { margin: 4px 0 8px; font-size: 10px; font-family: var(--font-mono); color: var(--text-dim); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
    .settings-row { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--hairline); }
    .settings-row:first-of-type { border-top: 0; }
    .settings-row .name { font-weight: 600; font-size: 12.5px; }
    .settings-row .desc { color: var(--text-mute); font-size: 11.5px; line-height: 1.4; margin-top: 2px; }
    .settings-row .val { color: var(--text-mute); font-family: var(--font-mono); font-size: 12px; text-align: right; }
    .settings-foot { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--hairline); }
    .settings-foot .summary { font-size: 11.5px; color: var(--text-mute); }

    /* Layout-only utilities */
    .hd-spacer { flex: 1; }
    .row-actions { display: inline-flex; gap: 6px; }

    /* When a modal view is requested, blur the kanban behind it like the real app. */
    body.modal-open .app { filter: blur(2px); }
  </style>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <span class="brand"><span class="mark">S</span> Switchboard</span>
      <span class="server-addr">127.0.0.1:8765</span>
      <span class="counts">
        <span><b>11</b> windows</span>
        <span class="amber"><b>1</b> waiting</span>
        <span class="cyan"><b>2</b> running</span>
        <span><b>8</b> idle</span>
      </span>
      <span class="spacer"></span>
      <span class="usage-pill" title="Anthropic API · rolling 5h">
        <span class="meter">session <b>52%</b><span class="bar"><i style="width:52%"></i></span></span>
        <span class="meter">week <b>23%</b><span class="bar"><i style="width:23%"></i></span></span>
        <span class="cost"><b>$3.42</b></span>
      </span>
      <button class="btn"><span>＋</span> Session</button>
      <button class="btn btn-ghost btn-icon" title="Keyboard shortcuts">?</button>
      <button class="btn btn-ghost btn-icon" title="Documentation">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 2.5h7l3 3v8a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-10a1 1 0 0 1 1-1Z" /><path d="M10 2.5v3h3" /><path d="M5 8h6M5 10.5h6M5 12.5h3" /></svg>
      </button>
      <button class="btn btn-ghost btn-icon" title="Settings">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="2.4"/><path d="M8 2v2M8 12v2M2 8h2M12 8h2M3.5 3.5l1.4 1.4M11.1 11.1l1.4 1.4M3.5 12.5l1.4-1.4M11.1 4.9l1.4-1.4"/></svg>
      </button>
    </header>

    <!-- Needs strip -->
    <div class="needs-strip">
      <span class="badge">NEEDS YOU</span>
      <button class="needs-card">
        <span>backend</span><span class="crumb">/</span><b>tests</b><span class="crumb">·</span><span class="action">Run failing tests now?</span>
      </button>
      <span class="spacer" style="flex:1"></span>
      <button class="btn-ghost btn-icon" title="Dismiss">✕</button>
    </div>

    <!-- Subhead -->
    <div class="subhead">
      <div class="search">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="7" cy="7" r="4.5"/><path d="M11 11l3 3"/></svg>
        <input placeholder="Filter… try kind:agent, status:waiting" />
        <span class="kbd">/</span>
      </div>
      <span class="row-actions">
        <button class="tab is-active">All <span class="count">11</span></button>
        <button class="tab"><span class="stat-dot amber"></span>Waiting <span class="count">1</span></button>
        <button class="tab"><span class="stat-dot cyan"></span>Running <span class="count">2</span></button>
        <button class="tab"><span class="stat-dot gray"></span>Idle <span class="count">8</span></button>
      </span>
      <span class="row-actions">
        <button class="tab">⌨ Agent</button>
        <button class="tab">＞ Shell</button>
      </span>
      <span class="hd-spacer"></span>
      <span class="row-actions">
        <button class="tab">–</button>
        <button class="tab">+</button>
      </span>
    </div>

    <!-- Main -->
    <main class="main">
      <div class="kanban" id="kanban"></div>
    </main>
  </div>

  <div id="overlay"></div>

  <script>
    /* ─── Dummy data ─────────────────────────────────────────── */
    const COLUMNS = [
      {
        name: "backend",
        attached: true,
        windows: [
          { kind: "agent", name: "deploy",     idx: 1, status: "idle",    branch: "main",                pr: 142, ci: "passing", recap: "Done. Migrations applied, all checks green. Ready for the next ticket." },
          { kind: "agent", name: "tests",      idx: 2, status: "waiting", branch: "feat/payments-fix",   pr: 187, ci: "running", pending: "Run failing tests now?" },
          { kind: "agent", name: "api-server", idx: 3, status: "running", branch: "feat/payments-fix",   pr: 187, ci: "running", spinner: "Synthesizing", duration: "1m" },
          { kind: "shell", name: "psql",       idx: 4, status: "idle",    branch: "feat/payments-fix",   pr: 187, ci: "running" },
        ],
      },
      {
        name: "frontend",
        attached: false,
        windows: [
          { kind: "shell", name: "vite",       idx: 1, status: "running", branch: "main",         spinner: "Hot-reloading", duration: "4s" },
          { kind: "agent", name: "tsc-watch",  idx: 2, status: "idle",    branch: "main",         recap: "0 errors. Watching for changes…" },
          { kind: "agent", name: "claude-ui",  idx: 3, status: "idle",    branch: "fix/dropdown-z", pr: 213, ci: "passing", recap: "Pushed the z-index fix; PR is green. Waiting on review." },
          { kind: "shell", name: "storybook",  idx: 4, status: "idle",    branch: "main" },
        ],
      },
      {
        name: "infra",
        attached: false,
        windows: [
          { kind: "shell", name: "tofu",       idx: 1, status: "idle",    branch: "main" },
          { kind: "agent", name: "grafana",    idx: 2, status: "idle",    branch: "main",         recap: "Dashboard JSON exported to /tmp/grafana-dashboards.json." },
          { kind: "shell", name: "pg-shell",   idx: 3, status: "idle" },
        ],
      },
    ];

    /* ─── Render kanban ─────────────────────────────────────── */
    const kanban = document.getElementById("kanban");
    for (const col of COLUMNS) {
      const node = document.createElement("section");
      node.className = "col";
      let cards = "";
      for (const w of col.windows) {
        const kindGlyph = w.kind === "agent" ? "C" : "$";
        const kindCls   = w.kind === "agent" ? "kind-agent" : "kind-shell";
        let chips = "";
        if (w.branch) {
          const ciDot = w.ci ? `<span class="ci-dot ci-${w.ci}"></span>` : "";
          const prChip = w.pr ? `<span class="chip pr">#${w.pr}</span>` : "";
          chips += `<div class="chip-row"><span class="chip">${ciDot}${w.branch}</span>${prChip}</div>`;
        }
        if (w.spinner) {
          chips += `<div class="chip-row spinner-row"><span class="chip spinner">⟳ ${w.spinner} <span style="color:var(--text-dim)">${w.duration||""}</span></span></div>`;
        }
        const recap = w.recap ? `<div class="recap">${w.recap}</div>` : "";
        const pending = w.pending ? `<div class="pending"><span class="glyph">›</span><span>${w.pending}</span></div>` : "";
        cards += `
          <article class="card ${w.status}">
            <div class="card-head">
              <span class="card-kind ${kindCls}">${kindGlyph}</span>
              <span class="card-name">${w.name} <span class="card-idx">:${w.idx}</span></span>
              <span class="card-status ${w.status}"><span class="glyph"></span>${w.status}</span>
            </div>
            ${chips}
            ${recap}
            ${pending}
            <div class="card-foot">
              <button class="act" title="Focus">◎</button>
              <button class="act" title="Rename">✎</button>
              <button class="act" title="Send keys">⌨</button>
              <button class="act" title="Kill">🗑</button>
              <span class="spacer"></span>
              <span class="ago">${["4s","18s","42s","3m","11m","26m","1h"][w.idx % 7]}</span>
            </div>
          </article>`;
      }
      node.innerHTML = `
        <header class="col-hd">
          <span class="col-name"><span class="col-name-dot ${col.attached ? "attached" : ""}"></span>${col.name}</span>
          <span class="col-count">${col.windows.length}</span>
          <span class="col-actions">
            <button class="btn-auto-rename" title="Auto-rename windows in ${col.name}">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 2v3M8 11v3M2 8h3M11 8h3M4 4l2 2M10 10l2 2M12 4l-2 2M6 10l-2 2"/>
              </svg>
            </button>
            <button class="col-quick">+claude</button>
            <button class="col-quick">+shell</button>
            <button class="kebab">⋮</button>
          </span>
        </header>
        <div class="col-body">${cards}</div>`;
      kanban.appendChild(node);
    }

    /* ─── Overlay views ───────────────────────────────────── */
    const overlay = document.getElementById("overlay");
    const view = new URLSearchParams(location.search).get("view") || "kanban";
    document.body.classList.toggle("modal-open", view !== "kanban");

    function openTerminal() {
      overlay.innerHTML = `
        <div class="scrim">
          <div class="term-modal">
            <header class="term-hd">
              <span class="tl-dots"><i></i><i></i><i></i></span>
              <span class="term-title">
                <span>backend</span><span class="crumb-sep">›</span><b>tests</b>
                <span class="chip" style="margin-left:8px"><span class="ci-dot ci-running"></span>feat/payments-fix</span>
                <span class="chip pr">#187</span>
                <span class="card-status waiting" style="margin-left:6px"><span class="glyph"></span>waiting</span>
                <span class="term-action">Run failing tests now?</span>
              </span>
              <span class="term-spacer"></span>
              <button class="btn-ghost btn-icon">✕</button>
            </header>
            <div class="term-body">
<span class="dim">$ pnpm test --watch</span>

<span class="info">PASS</span>  apps/checkout/cart.spec.ts (24 tests)
<span class="info">PASS</span>  apps/checkout/discount.spec.ts (11 tests)
<span class="err">FAIL</span>  apps/checkout/payments.spec.ts
  <span class="dim">● applyCoupon › refuses an expired coupon</span>
    expect(received).toEqual(expected)
      Expected: <span class="ok">{ ok: false, reason: <span class="warn">"expired"</span> }</span>
      Received: <span class="err">{ ok: false, reason: <span class="warn">"not-found"</span> }</span>
    <span class="dim">  at apps/checkout/payments.spec.ts:84:7</span>

Test Suites: <span class="err">1 failed</span>, <span class="info">3 passed</span>, 4 total
Tests:       <span class="err">1 failed</span>, <span class="info">58 passed</span>, 59 total
Time:        2.314s

<span class="glyph">⏺</span> The expired-coupon branch returns the wrong reason code. Looks like the
   coupon's <span class="warn">expires_at</span> check ran after the row-not-found
   guard. I'll move the expiry check ahead and re-run.

<div class="prompt-overlay">
  <b>›</b> Run failing tests now?
  <div class="opts">
    <span>Choose:</span>
    <span><kbd>y</kbd> accept</span>
    <span><kbd>n</kbd> decline</span>
    <span><kbd>Esc</kbd> cancel</span>
  </div>
</div>
            </div>
            <footer class="term-foot">
              <span class="connect-pill"><span class="dot"></span>WS live</span>
              <span class="term-cwd">~/code/example-app/apps/checkout</span>
              <span class="term-spacer"></span>
              <button class="btn btn-danger" style="height:24px;padding:0 8px;font-size:11px">🗑 Kill window</button>
              <span style="font-family:var(--font-mono);color:var(--text-dim);font-size:11px">ZOOM 100% · SIZE normal · Esc to pane · Esc Esc to close</span>
            </footer>
          </div>
        </div>`;
    }

    function openPalette() {
      overlay.innerHTML = `
        <div class="scrim">
          <div class="palette">
            <div class="palette-hd">
              <span class="target">Send to <b>backend:2 tests</b></span>
              <span class="esc">esc</span>
            </div>
            <div class="palette-section">Recent commands</div>
            <button class="palette-item is-active"><span class="icon">›</span><span class="label">ls -la</span><span class="hint">list files</span></button>
            <button class="palette-item"><span class="icon">›</span><span class="label">git status</span><span class="hint">git</span></button>
            <button class="palette-item"><span class="icon">▶</span><span class="label">pnpm test --watch</span><span class="hint">test</span></button>
            <button class="palette-item"><span class="icon">✕</span><span class="label">clear</span><span class="hint">clear screen</span></button>
            <button class="palette-item"><span class="icon">⚠</span><span class="label">Send Ctrl+C</span><span class="hint">interrupt</span></button>
            <div class="palette-section">Agent prompts</div>
            <button class="palette-item"><span class="icon">✓</span><span class="label">y</span><span class="hint">accept</span></button>
            <button class="palette-item"><span class="icon">✕</span><span class="label">n</span><span class="hint">decline</span></button>
            <button class="palette-item"><span class="icon">→</span><span class="label">continue</span><span class="hint">next step</span></button>
            <button class="palette-item"><span class="icon">✦</span><span class="label">look more carefully and try again</span><span class="hint">nudge</span></button>
            <div class="palette-foot">
              <span>↑↓ navigate</span><span>↩ send</span><span>esc cancel</span>
              <span style="margin-left:auto">target: backend:2</span>
            </div>
          </div>
        </div>`;
    }

    function openAutoRename() {
      const rows = [
        { from: "deploy",     to: "deploy",              noop: true },
        { from: "tests",      to: "checkout-payments" },
        { from: "api-server", to: "api-server-payments" },
        { from: "psql",       to: "psql-payments-debug" },
      ];
      const rowHtml = rows.map(r => `
        <div class="rename-row ${r.noop ? "noop" : ""}">
          <div class="row-head"><span class="lbl">from</span><span class="old">${r.from}</span></div>
          <div class="row-body"><span class="lbl">to</span><input value="${r.to}" /><button class="skip">${r.noop ? "no-op" : "skip"}</button></div>
        </div>`).join("");
      overlay.innerHTML = `
        <div class="scrim">
          <div class="auto-rename-modal">
            <header class="rename-hd">
              <span class="sparkle">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M8 2v3M8 11v3M2 8h3M11 8h3M4 4l2 2M10 10l2 2M12 4l-2 2M6 10l-2 2"/>
                </svg>
              </span>
              <b>Auto-rename windows in backend</b>
              <span class="hd-spacer"></span>
              <button class="btn-ghost btn-icon">✕</button>
            </header>
            <div class="rename-body">${rowHtml}</div>
            <footer class="rename-foot">
              <span class="summary"><b>3</b> of 4 accepted</span>
              <span class="summary cost">· <b>$0.0019</b></span>
              <span class="summary">· 1.9k tokens</span>
              <span class="hd-spacer"></span>
              <button class="btn">Cancel</button>
              <button class="btn btn-primary">✓ Apply</button>
            </footer>
          </div>
        </div>`;
    }

    function openSettings() {
      overlay.innerHTML = `
        <div class="scrim">
          <div class="settings-modal">
            <header class="settings-hd">
              <span class="brand"><span class="mark">S</span></span>
              <b>Settings</b>
              <span class="conn"><span class="connect-pill"><span class="dot"></span>connected · 127.0.0.1:8765</span></span>
              <button class="btn-ghost btn-icon" style="margin-left:10px">✕</button>
            </header>
            <div class="settings-body">
              <div class="settings-group">
                <h4>Auto-rename</h4>
                <div class="settings-row">
                  <span>
                    <div class="name">Anthropic API key</div>
                    <div class="desc">Picked up from <code>ANTHROPIC_API_KEY</code> in your shell environment.</div>
                  </span>
                  <span class="val" style="font-family:var(--font-mono)">sk-ant-…EAAA</span>
                  <span></span>
                </div>
                <div class="settings-row">
                  <span>
                    <div class="name">Model</div>
                    <div class="desc">Used by the ✨ auto-rename modal. Configure via <code>SWITCHBOARD_ANTHROPIC_MODEL</code>.</div>
                  </span>
                  <span class="val" style="font-family:var(--font-mono)">claude-haiku-4-5</span>
                  <span></span>
                </div>
              </div>

              <div class="settings-group">
                <h4>Claude usage</h4>
                <div class="settings-row">
                  <span>
                    <div class="name">Token aggregation</div>
                    <div class="desc">Sums tokens from <code>~/.claude/projects/*.jsonl</code> over the last 30s cache. Always on; no claude binary spawn.</div>
                  </span>
                  <span class="val">always on</span>
                  <span></span>
                </div>
                <div class="settings-row">
                  <span>
                    <div class="name">Plan-% scraping</div>
                    <div class="desc">Runs <code>claude /usage</code> in a hidden tmux session every 5min. Disable with <code>SWITCHBOARD_USAGE_SCRAPE_ENABLED=false</code>.</div>
                  </span>
                  <span class="val">enabled</span>
                  <span></span>
                </div>
              </div>

              <div class="settings-group">
                <h4>Appearance</h4>
                <div class="settings-row">
                  <span>
                    <div class="name">Theme</div>
                    <div class="desc">Color scheme for the dashboard.</div>
                  </span>
                  <span class="val">Dark</span>
                  <span></span>
                </div>
                <div class="settings-row">
                  <span>
                    <div class="name">Replay first-run tour</div>
                    <div class="desc">Re-show the 4-step intro right now — reloads the dashboard.</div>
                  </span>
                  <span></span>
                  <button class="btn" style="height:24px;padding:0 10px;font-size:11px">Reset</button>
                </div>
              </div>
            </div>
            <footer class="settings-foot">
              <span class="summary">3 sessions · 11 windows</span>
              <span class="hd-spacer"></span>
              <button class="btn btn-primary">✓ Done</button>
            </footer>
          </div>
        </div>`;
    }

    if (view === "terminal") openTerminal();
    else if (view === "palette") openPalette();
    else if (view === "rename") openAutoRename();
    else if (view === "settings") openSettings();
  </script>
</body>
</html>
