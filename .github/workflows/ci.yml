name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + ty + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: ruff check
        run: uv run ruff check .

      - name: ty check
        # Pin the ty version: `uvx ty` (unpinned) pulls whatever is newest at
        # run time, and newer ty releases flag pre-existing `# ty: ignore`
        # directives as unused — turning CI red on unrelated PRs without any
        # code change. Bump this deliberately.
        run: uvx ty@0.0.35 check

      - name: pytest
        run: uv run pytest

  frontend:
    name: Frontend (tsc + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  a11y:
    name: A11y (WCAG contrast audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Token sync (styles.css → contrast_audit.py)
        run: python3 scripts/a11y/contrast_audit.py --check-sync

      # Enforces only the rules this audit owns end-to-end (THI-151 focus
      # rings, THI-151 hover deltas, THI-152 disabled text, THI-155
      # selection bands). Pre-existing gaps the audit surfaces (text
      # tones in light mode, hairline borders) have their own tickets;
      # widen this allowlist as each lands.
      - name: Contrast audit — focus / hover / disabled / selection (AA)
        run: |
          python3 scripts/a11y/contrast_audit.py \
            --rule focus --rule hover --rule disabled --rule selection --quiet
