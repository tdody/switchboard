  <g fill="#54c98a">
    <circle cx="20" cy="22" r="3" opacity=".35" />
    <circle cx="32" cy="22" r="3" opacity=".35" />
    <circle cx="44" cy="22" r="3" opacity=".35" />
    <circle cx="20" cy="34" r="3" opacity=".22" />
