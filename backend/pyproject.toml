[project]
name = "switchboard"
version = "0.1.0"
description = "Live tmux dashboard backend"
readme = "../README.md"
license = "MIT"
license-files = ["../LICENSE"]
authors = [{ name = "Thibault Dody" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "libtmux>=0.39",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "websockets>=13",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.9",
    "websockets>=16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/switchboard"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "BLE"]

[tool.ty.src]
include = ["src"]

[tool.ty.rules]
# libtmux's Server.cmd type stub uses an unfortunate union that ty reads as
# requiring exactly 2 positional args, even though `*args: Any` accepts more.
# Every call site is a false positive; libtmux works fine at runtime.
too-many-positional-arguments = "ignore"
